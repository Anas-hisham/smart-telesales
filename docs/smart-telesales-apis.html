<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesFlow CRM API · UI integration guide</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--surface2:#f1f3f6;--border:#e2e5ea;--text:#1b1f27;--muted:#626b7a;--accent:#4f46e5;--accent-soft:#eceafd;
  --code-bg:#0f172a;--code-text:#e2e8f0;--k:#7dd3fc;--s:#86efac;--n:#fcd34d;--b:#f9a8d4;
  --get:#0e9f6e;--post:#2563eb;--put:#d97706;--patch:#7c3aed;--delete:#dc2626;
  --ok:#0e9f6e;--warn:#d97706;--err:#dc2626;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1017;--surface:#151922;--surface2:#1c212c;--border:#2a303d;--text:#e6e9ef;--muted:#98a1b3;--accent:#8b85ff;--accent-soft:#232048;--code-bg:#090c12;
}}
:root[data-theme="dark"]{
  --bg:#0d1017;--surface:#151922;--surface2:#1c212c;--border:#2a303d;--text:#e6e9ef;--muted:#98a1b3;--accent:#8b85ff;--accent-soft:#232048;--code-bg:#090c12;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font)}
code,pre,.mono{font-family:var(--mono)}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;padding:10px 18px}
.top h1{font-size:16px;margin:0;white-space:nowrap}
.top .ver{font-size:12px;color:var(--muted)}
.top input[type=search]{flex:1;min-width:120px;max-width:520px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{background:var(--surface2)}
.menu-btn{display:none}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1500px;margin:0 auto}
nav.side{position:sticky;top:55px;align-self:start;height:calc(100vh - 55px);overflow:auto;padding:14px 12px 40px;border-right:1px solid var(--border)}
nav.side h4{margin:16px 8px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.side a{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:13px}
nav.side a:hover{background:var(--surface2)}
nav.side a .m{font:700 9.5px var(--mono);min-width:44px;text-align:center;padding:2px 0;border-radius:4px;color:#fff}
nav.side a .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
nav.side .cnt{margin-left:auto;font-size:11px;color:var(--muted)}
main{padding:22px 26px 80px;min-width:0}
.m-GET{background:var(--get)}.m-POST{background:var(--post)}.m-PUT{background:var(--put)}.m-PATCH{background:var(--patch)}.m-DELETE{background:var(--delete)}
section.intro{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:22px}
section.intro h2{margin:0 0 8px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card code{word-break:break-all;background:var(--surface);border:1px solid var(--border);padding:0 5px;border-radius:4px;font-size:12.5px}
.card b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.group{margin-top:34px}
.group>h2{font-size:18px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.group>h2 small{color:var(--muted);font-weight:400;font-size:13px}
.ep{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ep>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.ep>summary::-webkit-details-marker{display:none}
.ep>summary:hover{background:var(--surface2)}
.badge{font:700 11px var(--mono);color:#fff;padding:3px 0;border-radius:5px;min-width:56px;text-align:center}
.path{font:600 13.5px var(--mono);word-break:break-all}
.path i{font-style:normal;color:var(--accent)}
.sum{color:var(--muted);font-size:13.5px;flex:1;min-width:200px}
.who{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px;white-space:nowrap}
.who.pub{background:#fff3d6;color:#8a5a00}
.ep[open]>summary{border-bottom:1px solid var(--border);background:var(--surface2)}
.body{padding:14px 16px 18px}
.desc{margin:0 0 12px;color:var(--text)}
.desc code,td code,.md code{background:var(--surface2);border:1px solid var(--border);padding:0 5px;border-radius:4px;font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 12px;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--muted);padding:8px 12px;cursor:pointer;font:600 13px var(--font);border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{display:none}.pane.on{display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
.tw{overflow:auto;max-height:440px;border:1px solid var(--border);border-radius:8px;margin:6px 0 12px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{position:sticky;top:0;background:var(--surface2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.f{font:600 12.5px var(--mono);white-space:nowrap}
.req{color:var(--err);font-size:11px;font-weight:700}
.opt{color:var(--muted);font-size:11px}
.ty{font:12px var(--mono);color:var(--patch)}
.enum{display:inline-block;font:11.5px var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0 5px;margin:1px 2px 1px 0}
.codebox{position:relative;margin:6px 0 12px}
.codebox pre{margin:0;background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.5;max-height:520px}
.copy{position:absolute;top:8px;right:8px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
.copy:hover{background:#334155}
.jk{color:var(--k)}.js{color:var(--s)}.jn{color:var(--n)}.jb{color:var(--b)}
.st{display:inline-block;font:700 12px var(--mono);padding:2px 8px;border-radius:5px;margin-right:6px;color:#fff}
.st2{background:var(--ok)}.st4{background:var(--warn)}.st5{background:var(--err)}
.rh{margin:12px 0 4px;font-weight:600;font-size:13.5px}
.note{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.variant{display:flex;gap:6px;margin:4px 0;flex-wrap:wrap}
.hidden{display:none!important}
.md p{margin:0 0 8px}
.md pre{background:var(--code-bg);color:var(--code-text);padding:12px 14px;border-radius:8px;overflow:auto;font-size:12.5px}
.models .ep>summary .path{font-family:var(--mono)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:55px;width:290px;z-index:15;background:var(--surface);transform:translateX(-100%);transition:transform .2s;height:calc(100vh - 55px)}
  nav.side.open{transform:none;box-shadow:0 10px 40px #0006}
  .menu-btn{display:inline-block}
  main{padding:16px 12px 60px}
}
@media print{.top,nav.side{display:none}.layout{display:block}.ep{break-inside:avoid}.ep>.body{display:block}}
</style>
</head>
<body>
<header class="top">
  <button class="btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  <h1>SalesFlow API <span class="ver" id="ver"></span></h1>
  <input type="search" id="q" placeholder="Search path, summary, field or role…  ( / )" autocomplete="off">
  <button class="btn" id="expand">Expand all</button>
  <button class="btn" id="collapse">Collapse all</button>
  <button class="btn" id="theme" title="Toggle theme">◐</button>
</header>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<script id="data" type="application/json">{"info": {"title": "SalesFlow CRM API", "version": "1.0.0", "description": "Backend of SalesFlow CRM. Base path: `/api`. JSON in, JSON out. Times are ISO-8601 UTC strings; dates are `YYYY-MM-DD` and times `HH:mm` on the organisation's clock (Africa/Cairo).\n\n**Sign in:** `POST /auth/login`, then click **Authorize** and paste the `accessToken`. It lives 15 minutes; renew it with `POST /auth/refresh`.\n\n**Errors** always look like `{ \"error\": { \"code\", \"message\", \"details?\" } }`. Codes: UNAUTHENTICATED, TOKEN_EXPIRED, INVALID_CREDENTIALS, FORBIDDEN, NOT_OWNER, NOT_FOUND, VALIDATION_FAILED (422), LEAD_NOT_WORKABLE, TOUCHPOINT_NOT_OPEN, HAS_SALE, CODE_TAKEN, CAMPAIGN_CODE_EXISTS, CAMPAIGN_IN_USE, USERNAME_TAKEN, EMAIL_TAKEN, TEAM_NAME_TAKEN, USER_HAS_DEPENDENTS, ALREADY_RESOLVED, REQUEST_IN_PROGRESS (409), TOO_MANY_ATTEMPTS (429), EMAIL_PROVIDER_FAILED (502).\n\n**Idempotency:** the POSTs that send an email or record a call / sale accept an `Idempotency-Key` header.\n\n**Notifications:** every change below that says \"notified\" puts one row in that person's `GET /notifications` (type `update` unless stated). Nobody is notified about what they did themselves, and a disabled user is never notified.\n\n**Background jobs (no endpoint):** the server runs these on a timer (every 30-60 seconds, each one safe to repeat). 1) *Auto email* - an EMAIL step that is due is sent by the system and completed (template `discovery` if the lead reached Discovery, otherwise `no_response`; never twice: key `auto|leadId|round|order`; no email address, or a lead that is stopped / removed / expired, or a call step in front = nothing is sent). 2) *15-day rule* - a lead with no progress for 15 calendar days (same step, or stopped) is freed into the pool (`removedFromQueue = true`, `stopped = true`, history `expired_15_days`) and its agent gets an `overdue` notification; a lead with an upcoming arranged meeting, or with a recorded sale, is never freed, and a meeting day counts as activity. 3) *Finished workflow* - a lead whose every step is done or skipped is freed the same way (history `workflow_finished`) unless it has an upcoming meeting or a sale. 4) *Meeting reminder* - 15 minutes before an arranged meeting every participant and its creator gets a `meeting` notification, once (`reminderSentAt`)."}, "servers": [{"url": "/api", "description": "This server"}, {"url": "http://localhost:3000/api", "description": "Local server (npm run dev)"}], "tags": ["Auth", "Directory", "Campaigns", "Lead pool (Admin)", "Lead pool (Agent)", "Leads", "Lead actions", "Emails", "Meetings", "Team updates", "Tasks", "Tips", "Sales", "Escalations", "Notifications", "Dashboard & analytics"], "ops": [{"id": "post/auth/login", "method": "POST", "path": "/auth/login", "tag": "Auth", "summary": "Sign in", "description": "Wrong username, wrong password and a disabled account all give the same answer (INVALID_CREDENTIALS). Usernames are not case sensitive. 5 tries a minute per IP + username.", "who": "public", "public": true, "params": [], "body": {"contentType": "application/json", "required": true, "rows": [{"name": "username", "type": "string", "req": true, "desc": "", "enum": null, "extra": []}, {"name": "password", "type": "string", "req": true, "desc": "", "enum": null, "extra": []}], "example": {"username": "mona.agent", "password": "Temp#12345"}, "hasRealExample": true}, "responses": [{"status": "200", "description": "OK", "rows": [{"name": "accessToken", "type": "string", "req": true, "desc": "", "enum": null, "extra": []}, {"name": "refreshToken", "type": "string", "req": true, "desc": "", "enum": null, "extra": []}, {"name": "expiresIn", "type": "integer", "req": true, "desc": "seconds", "enum": null, "extra": []}, {"name": "user", "type": "User", "req": true, "desc": "", "enum": null, "extra": []}, {"name": "user.id", "type": "string (uuid)", "req": true, "desc": "", "enum": null, "extra": []}, {"name": "user.username", const $ = (s, r=document) => r.querySelector(s);

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* ---------- tiny markdown ---------- */
function inline(t){ return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function md(t){
  if(!t) return '';
  const lines = t.split('\n'); let out=''; let i=0;
  while(i<lines.length){
    const l = lines[i];
    if(l.startsWith('```')){ let j=i+1, buf=[]; while(j<lines.length && !lines[j].startsWith('```')) buf.push(lines[j++]); out+=`<pre>${hl(buf.join('\n'))}</pre>`; i=j+1; continue; }
    if(l.trim().startsWith('|') && lines[i+1] && /^\s*\|[\s\-|:]+\|\s*$/.test(lines[i+1])){
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(l); let j=i+2, rows=[];
      while(j<lines.length && lines[j].trim().startsWith('|')) rows.push(cells(lines[j++]));
      out+=`<div class="tw"><table><tr>${head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
      i=j; continue;
    }
    if(!l.trim()){ i++; continue; }
    let buf=[l]; i++;
    while(i<lines.length && lines[i].trim() && !lines[i].startsWith('```') && !lines[i].trim().startsWith('|')) buf.push(lines[i++]);
    out+=`<p>${inline(buf.join(' '))}</p>`;
  }
  return out;
}

/* ---------- JSON highlight ---------- */
function hl(s){
  return esc(s).replace(/(&quot;(?:\\.|[^&\\])*?&quot;)(\s*:)?|\b(true|false)\b|\bnull\b|-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b/g,(m,str,colon,bool)=>{
    if(str) return colon ? `<span class="jk">${str}</span>${colon}` : `<span class="js">${str}</span>`;
    if(bool) return `<span class="jb">${m}</span>`;
    if(m==='null') return `<span class="jb">null</span>`;
    return `<span class="jn">${m}</span>`;
  });
}
const J = o => JSON.stringify(o,null,2);
let uid = 0;
function code(text, isJson=true){ const id='c'+(uid++); return `<div class="codebox"><button class="copy" data-copy="${id}">Copy</button><pre id="${id}" data-raw="${esc(text)}">${isJson?hl(text):esc(text)}</pre></div>`; }

/* ---------- field tables ---------- */
function fieldTable(rows, withReq=true){
  if(!rows || !rows.length) return '<p class="note">No fields.</p>';

    if(r.enum) notes.push(r.enum.map(e=>`<span class="enum">${esc(e)}</span>`).join(''));
    if(r.extra && r.extra.length) notes.push(`<span class="opt">${esc(r.extra.join(' · '))}</span>`);
    return `<tr><td class="f">${esc(r.name)}</td><td class="ty">${esc(r.type)}</td>${withReq?`<td>${r.req?'<span class="req">required</span>':'<span class="opt">optional</span>'}</td>`:''}<td>${notes.join('<br>')}</td></tr>`;
  }).join('')}</table></div>`;
}
function paramTable(ps){
  return `<div class="tw"><table><tr><th>Name</th><th>In</th><th>Type</th><th>Required</th><th>Example</th><th>Notes</th></tr>${ps.map(p=>`<tr>
    <td class="f">${esc(p.name)}</td><td>${p.in}</td><td class="ty">${esc(p.type)}</td>
    <td>${p.required?'<span class="req">required</span>':'<span class="opt">optional</span>'}</td>

    <td>${p.desc?inline(p.desc)+'<br>':''}${p.enum?p.enum.map(e=>`<span class="enum">${esc(e)}</span>`).join(''):''}${p.default!==null&&p.default!==undefined?` <span class="opt">default: ${esc(p.default)}</span>`:''}</td></tr>`).join('')}</table></div>`;
}

/* ---------- endpoint card ---------- */
function stClass(s){ return 'st st'+s[0]; }
function epHtml(o){

    res += `<div class="rh"><span class="${stClass(r.status)}">${r.status}</span>${esc(r.description)}${r.schemaName?` <span class="opt">· ${esc(r.schemaName)}</span>`:''}</div>`;

  tabs.push(['cURL', code(o.curl,false)+'<p class="note">Replace <code>{{BASE_URL}}</code> with your server (e.g. <code>http://localhost:3000/api</code>) and <code>&lt;accessToken&gt;</code> with the token from login.</p>']);
  const tid = 'ep'+(uid++);
  return `<details class="ep" id="${esc(slug(o.method+o.path))}" data-method="${o.method}" data-tag="${esc(o.tag)}" data-search="${esc((o.method+' '+o.path+' '+o.summary+' '+o.who+' '+o.description+' '+(o.body?o.body.rows.map(r=>r.name).join(' '):'')).toLowerCase())}" data-who="${esc(o.who.toLowerCase())}">
    <summary><span class="badge m-${o.method}">${o.method}</span><span class="path">${pathHtml}</span><span class="sum">${esc(o.summary)}</span><span class="who ${o.public?'pub':''}">${esc(o.who)}</span></summary>
    <div class="body">
      ${o.description?`<div class="desc md">${md(o.description)}</div>`:''}
      ${D.guides && D.guides[o.method+' '+o.path] ? `<details><summary style="cursor:pointer;color:var(--accent);font-weight:600;margin:6px 0">Account creation rules (per role)</summary><div class="md" style="margin-top:8px">${md(D.guides[o.method+' '+o.path])}</div></details>`:''}
      <div class="tabs" role="tablist">${tabs.map((t,i)=>`<button class="tab ${i?'':'on'}" data-pane="${tid}-${i}">${esc(t[0])}</button>`).join('')}</div>
      ${tabs.map((t,i)=>`<div class="pane ${i?'':'on'}" id="${tid}-${i}">${t[1]}</div>`).join('')}
    </div></details>`;
}

/* ---------- page ---------- */
const roles = ['agent','team_leader','operation_manager','quality','admin','public'];
function build(){
  $('#ver').textContent = 'v'+D.info.version+' · '+D.ops.length+' endpoints';
  const byTag = {}; D.ops.forEach(o=>(byTag[o.tag] ||= []).push(o));
  // sidebar
  let nav = `<h4>Start</h4><a href="#overview">Overview &amp; auth</a><a href="#errors">Error format</a><h4>Endpoints</h4>`;
  nav += D.tags.filter(t=>byTag[t]).map(t=>`<a href="#g-${slug(t)}"><span class="p" style="font-family:var(--font);font-size:13px">${esc(t)}</span><span class="cnt">${byTag[t].length}</span></a>`).join('');
  nav += `<h4>Data models</h4><a href="#models">All models (${D.models.length})</a>`;
  $('#side').innerHTML = nav;
  // overview
  const desc = D.info.description.split('\n\n');
  let html = `<section class="intro" id="overview"><h2>${esc(D.info.title)}</h2>
    <p style="margin:0 0 10px;color:var(--muted)">One page for the UI team: every endpoint with its parameters, example request, example response, and error cases. Example values are illustrative, built from the OpenAPI schema (ids are fake UUIDs).</p>
    <div class="grid">
      <div class="card"><b>Base URL</b><code>${esc(D.servers[0].url)}</code><br><code>${esc(D.servers[1]?D.servers[1].url:'')}</code></div>
      <div class="card"><b>Auth</b>Send <code>Authorization: Bearer &lt;accessToken&gt;</code>. Get it from <code>POST /auth/login</code>. It lives 15 minutes, renew with <code>POST /auth/refresh</code>.</div>
      <div class="card"><b>Formats</b>JSON in and out. Times are ISO-8601 UTC. Dates <code>YYYY-MM-DD</code>, times <code>HH:mm</code> on the Africa/Cairo clock.</div>
      <div class="card"><b>Idempotency</b>Email, call and sale POSTs accept an <code>Idempotency-Key</code> header: the same key returns the first answer and does nothing twice.</div>
    </div>
    <details><summary style="cursor:pointer;color:var(--accent);font-weight:600">Notifications and background jobs (no endpoint)</summary><div class="md" style="margin-top:8px">${desc.slice(3).map(md).join('')}</div></details>
  </section>
  <section class="intro" id="errors"><h2>Error format</h2>
    <p>Every error has the same shape. Show <code>message</code> to the user, switch on <code>code</code> in your code, and map <code>details[].field</code> to form inputs on <code>422</code>.</p>
    ${code(J({error:{code:'VALIDATION_FAILED',message:'Check the fields',details:[{field:'email',message:'Must be a valid email address'}]}}))}
    <div class="tw"><table><tr><th>Status</th><th>Codes</th></tr>
      <tr><td class="f">401</td><td>UNAUTHENTICATED, TOKEN_EXPIRED (refresh the token and retry), INVALID_CREDENTIALS</td></tr>
      <tr><td class="f">403</td><td>FORBIDDEN, NOT_OWNER</td></tr>
      <tr><td class="f">404</td><td>NOT_FOUND</td></tr>
      <tr><td class="f">409</td><td>LEAD_NOT_WORKABLE, TOUCHPOINT_NOT_OPEN, HAS_SALE, CODE_TAKEN, CAMPAIGN_CODE_EXISTS, CAMPAIGN_IN_USE, USERNAME_TAKEN, EMAIL_TAKEN, TEAM_NAME_TAKEN, USER_HAS_DEPENDENTS, ALREADY_RESOLVED, REQUEST_IN_PROGRESS</td></tr>
      <tr><td class="f">422</td><td>VALIDATION_FAILED</td></tr>
      <tr><td class="f">429</td><td>TOO_MANY_ATTEMPTS</td></tr>
      <tr><td class="f">502</td><td>EMAIL_PROVIDER_FAILED</td></tr>
    </table></div></section>`;
  html += `<div class="filters" id="filters"><span class="opt">Method:</span>${['GET','POST','PUT','PATCH','DELETE'].map(m=>`<button class="chip" data-m="${m}">${m}</button>`).join('')}
    <span class="opt" style="margin-left:10px">Role:</span>${roles.map(r=>`<button class="chip" data-r="${r}">${r}</button>`).join('')}<span class="opt" id="count" style="margin-left:auto"></span></div>`;
  for(const t of D.tags){ if(!byTag[t]) continue;
    html += `<div class="group" id="g-${slug(t)}" data-group><h2>${esc(t)} <small>${byTag[t].length} endpoints</small></h2>${byTag[t].map(epHtml).join('')}</div>`;
  }
  html += `<div class="empty hidden" id="none">No endpoint matches your search or filters.</div>`;
  html += `<div class="group models" id="models"><h2>Data models <small>${D.models.length} schemas used by the endpoints</small></h2>${D.models.map(m=>`
    <details class="ep" data-model><summary><span class="path">${esc(m.name)}</span><span class="sum">${esc((m.description||'').slice(0,110))}</span></summary><div class="body">
    ${m.description?`<div class="desc md">${md(m.description)}</div>`:''}
    ${m.enum?`<p>${m.enum.map(e=>`<span class="enum">${esc(e)}</span>`).join('')}</p>`:fieldTable(m.rows,true)}
    <div class="rh">Example</div>${code(J(m.example))}</div></details>`).join('')}</div>`;
  html += `<footer>Generated from openapi.json · ${D.ops.length} endpoints · ${D.models.length} models</footer>`;
  $('#main').innerHTML = html;
}
build();

/* ---------- interactions ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('.tab');
  if(t){ const box=t.closest('.body'); box.querySelectorAll(':scope>.tabs>.tab').forEach(x=>x.classList.toggle('on',x===t)); box.querySelectorAll(':scope>.pane').forEach(p=>p.classList.toggle('on',p.id===t.dataset.pane)); return; }
  const c = e.target.closest('.copy');
  if(c){ const pre=document.getElementById(c.dataset.copy); const txt=pre.dataset.raw||pre.textContent;
    const done=()=>{c.textContent='Copied';setTimeout(()=>c.textContent='Copy',1200)};
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done)); else fallback(txt,done); return; }
  const v = e.target.closest('[data-var]');
  if(v){ const b=v.closest('.pane'); b.querySelectorAll('[data-var]').forEach(x=>x.classList.toggle('on',x===v)); b.querySelectorAll('[data-var-pane]').forEach(p=>p.classList.toggle('hidden',p.dataset.varPane!==v.dataset.var)); return; }
  if(e.target.closest('nav.side a')) $('#side').classList.remove('open');
});
function fallback(txt,done){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done()}catch(_){} ta.remove(); }
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#expand').onclick=()=>document.querySelectorAll('details.ep:not(.hidden)').forEach(d=>d.open=true);
$('#collapse').onclick=()=>document.querySelectorAll('details.ep').forEach(d=>d.open=false);
$('#theme').onclick=()=>{ const r=document.documentElement; const dark=(r.dataset.theme==='dark')||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme=dark?'light':'dark'; };
let M=new Set(), R=new Set();
function apply(){
  const q = $('#q').value.trim().toLowerCase(); let shown=0;
  document.querySelectorAll('details.ep[data-method]').forEach(d=>{
    let ok = (!q || d.dataset.search.includes(q)) && (!M.size || M.has(d.dataset.method));
    if(ok && R.size){ const w=d.dataset.who; ok=[...R].some(r=> r==='public' ? w==='public' : (w.includes(r) || w.includes('any signed-in'))); }
    d.classList.toggle('hidden',!ok); if(ok) shown++;
  });
  document.querySelectorAll('[data-group]').forEach(g=>g.classList.toggle('hidden',!g.querySelector('details.ep:not(.hidden)')));
  $('#none').classList.toggle('hidden',shown>0); $('#count').textContent=shown+' of '+D.ops.length+' shown';
  if(q && shown && shown<=6) document.querySelectorAll('details.ep[data-method]:not(.hidden)').forEach(d=>d.open=true);
}
$('#q').addEventListener('input',apply);
$('#filters').addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(!c) return; c.classList.toggle('on'); const set=c.dataset.m?M:R; const k=c.dataset.m||c.dataset.r; set.has(k)?set.delete(k):set.add(k); apply(); });
addEventListener('keydown',e=>{ if(e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); } });
function openHash(){ const id=decodeURIComponent(location.hash.slice(1)); const el=id&&document.getElementById(id); if(el&&el.tagName==='DETAILS'){ el.open=true; el.scrollIntoView(); } }
addEventListener('hashchange',openHash); openHash(); apply();
</script>
</body>
</html>
